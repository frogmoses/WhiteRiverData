name: Secret Scan (gitleaks)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # required to scan full git history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Without a token the action's owner-type lookup runs unauthenticated
          # and intermittently hits the runner IP's anonymous rate limit; the
          # failed lookup makes it demand a GITLEAKS_LICENSE (org-only) and fail
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
