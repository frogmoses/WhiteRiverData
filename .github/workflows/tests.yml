name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra test

      # No browser install: the tests parse saved HTML and never launch
      # Playwright, and the network is switched off by tests/conftest.py
      - name: Run tests
        run: uv run pytest -q
